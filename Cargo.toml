[workspace]
members = [
    "bin/*",
    "programs/mango-v4",
    "lib/*",
    "rust-harness",
]

[workspace.dependencies]
anchor-client = "0.28.0"
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
# Retained only for off-chain client binaries (cli/settler/keeper/liquidator/lib-client);
# the on-chain mango-v4 program has migrated to Pyth pull-oracle PriceUpdateV2 accounts
# and no longer pulls this crate.
pyth-sdk-solana = "0.8.0"
fixed = { git = "https://github.com/blockworks-foundation/fixed.git", branch = "v1.11.0-borsh0_10-mango" }
# commit c85e56d (0.5.10 plus dependency updates)
serum_dex = { git = "https://github.com/openbook-dex/program.git", default-features=false }
mango-feeds-connector = "0.2.1"
openbook-v2 = { path = "third-party/openbook-v2-patched/programs/openbook-v2" }

# Keep the workspace pinned to the older Solana line used by the local SBF toolchain.
solana-address-lookup-table-program = "=1.16.14"
solana-account-decoder = "=1.16.14"
solana-client = "=1.16.14"
solana-logger = "=1.16.14"
solana-program = "=1.16.14"
solana-program-test = "=1.16.14"
solana-rpc = "=1.16.14"
solana-sdk = { version = "=1.16.14", default-features = false }
solana-transaction-status = { version = "=1.16.14" }
spl-associated-token-account = "1.0.3"

[profile.release]
overflow-checks = true

[patch.crates-io]
# for gzip encoded responses
jsonrpc-core-client = { git = "https://github.com/ckamm/jsonrpc.git", branch = "ckamm/http-with-gzip" }
ahash_07 = { package = "ahash", path = "third-party/ahash-0.7.8-local" }
ahash_08 = { package = "ahash", path = "third-party/ahash-0.8.11-local" }
solana-program = { path = "third-party/solana-program-1.16.14-local" }
anchor-syn = { path = "third-party/anchor-syn-0.28.0-local" }
anchor-attribute-program = { path = "third-party/anchor-attribute-program-0.28.0-local" }
globset = { path = "third-party/globset-0.4.16-local" }
quote = { path = "third-party/quote-1.0.45-local" }
zmij = { path = "third-party/zmij-1.0.21-local" }
num_enum = { path = "third-party/num_enum-0.7.6-local" }
num_enum_derive = { path = "third-party/num_enum_derive-0.7.6-local" }
proc-macro-crate = { path = "third-party/proc-macro-crate-1.3.1-local" }
unicode-ident = { path = "third-party/unicode-ident-1.0.24-local" }
syn = { path = "third-party/syn-2.0.117-local" }
