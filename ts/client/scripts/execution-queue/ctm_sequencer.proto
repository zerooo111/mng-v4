syntax = "proto3";

package ctmsequencer;

message AccountMeta {
  string pubkey = 1;
  bool is_signer = 2;
  bool is_writable = 3;
}

message SubmitIntentRequest {
  string group = 1;
  string execution_queue = 2;
  string market = 3;
  bytes payload = 4;
  repeated AccountMeta remaining_accounts = 5;
  uint64 min_execute_slot = 6;
  uint64 expires_at_slot = 7;
  string user_owner = 8;
  string mango_account = 9;
  bytes user_signature = 10;
  string base_fee = 11;
  uint32 intent_version = 12;
  uint32 target_kind = 13;
  uint32 target_index = 14;
  // P0.5 single-hash migration: 8-byte random randomizer the user
  // generated when signing the intent. Bound into
  // canonical_user_intent_v3 on-chain. 0 is a valid placeholder for
  // non-user-signed intents (relayer-originated sweeps, admin ops);
  // user-signed intents MUST set a random value per intent.
  uint64 client_order_id = 15;
}

message SubmitIntentResponse {
  uint64 sequence = 1;
  string tx_signature = 2;
  bytes user_intent_message = 3;
  bytes ctm_envelope_message = 4;
}

service CtmSequencerRelayer {
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
}
